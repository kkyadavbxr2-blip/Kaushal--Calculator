name: Build Kaushal Calculator APK

"on":
  workflow_dispatch:
  push:
    paths:
      - "main.py"
      - "buildozer.spec"
      - ".github/workflows/build.yml"

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Pin pip to a compatible version
        run: python -m pip install --upgrade "pip<24"

      - name: Build APK
        uses: digreatbrian/buildozer-action@v2
        with:
          python-version: "3.8"
          buildozer-cmd: buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KaushalCalculator
          path: bin/*.apk
          if-no-files-found: error
